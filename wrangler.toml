# Cloudflare Workers static assets (SPA + prebuilt /api/*.json).
# No Worker script: catalog/works are static JSON; search falls back client-side.
name = "piblia"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Workers Builds / dashboard may also set this; keep in sync with package.json.
[build]
command = "pnpm install --frozen-lockfile && pnpm build"
